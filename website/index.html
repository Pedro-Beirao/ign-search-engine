<!DOCTYPE html>
<html>
<head>
<title>IGN Reviews Search</title>
<script>
    window.onload = function()
    {
        document.querySelector("form").addEventListener("submit", function(e)
        {
            e.preventDefault();
            fetch("http://127.0.0.1:8983/solr/ign_simple/select?indent=true&q.op=OR&q=Content%3Ataito%27s&useParams=", {
                method: 'GET'
            }).then(function(response)
            {
                return response.json();
            }).then(function(data) {
                const div = document.createElement("div");
    
                div.className = "item";
                div.textContent = JSON.stringify(data);

                document.getElementById("list").appendChild(div);  
            });
        });
    }
</script>
<style>
    body
    {
        padding: 2em;
    }

    form
    {
        text-align: center;
    }

    #ftext
    {
        width: 70%;
    }

    h1
    {
        text-align: center;
    }

    #list
    {
        text-align: center;
        padding-left: 10%;
        padding-right: 10%;
    }

    .item
    {
        background-color: red;
        padding: 1em;
    }
</style>
</head>
<body>
    <h1>IGN Review Search</h1>
    <form>
        <input type="text" id="ftext" name="ftext" value="">
        <br><br>
        <label for="frat">Rating:</label><br>
        <input type="number" id="fmin" name="fmin" min="1" max="10" placeholder="1"> < 
        <input type="number" id="fmax" name="fmax" min="1" max="10" placeholder="10">
        <br><br>
        <input type="submit" value="Search">
    </form>
    <br>
    <div id="list">

    </div>
</body>
</html>
