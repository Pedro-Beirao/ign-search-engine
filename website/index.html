<!DOCTYPE html>
<html>
<head>
<title>IGN Reviews Search</title>
<script>
    window.onload = function()
    {
        document.querySelector("form").addEventListener("submit", function(e)
        {
            e.preventDefault();
            fetch("http://127.0.0.1:8983/solr/ign_simple/select?indent=true&q.op=OR&q=Content%3Ataito%27s&useParams=", {
                method: 'GET'
            }).then(x =>
            {
                alert(x)
                console.log(x);
                const div = document.createElement("div");
    
                div.id = "div_id" ;
                div.className = "div_class";
                div.style = "background-color: red;";
                div.style.width = "100px";
                div.style.height = "100px";
                div.textContent = x.text();

                document.getElementById("response").appendChild(div);  
            })
        });
    }
</script>
</head>
<body>

    <form>
        <input type="text" id="ftext" name="ftext" value=""><br><br>
        <label for="frat">Rating:</label>
        <input type="number" id="frat" name="frat" min="1" max="10"><br><br>
        <input type="submit" value="Search">
    </form>
    <div id="response">

    </div>
</body>
</html>
